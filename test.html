<!DOCTYPE html>
<html>
<body>
  <input id="msg" placeholder="Type a guess" />
  <button onclick="sendGuess()">Guess</button>
  <button onclick="startGame()">Start Game</button>
  <div id="log"></div>

  <script>
    const ws = new WebSocket("ws://localhost:3223/?room=testroom")

    ws.onopen = () => log("Connected! My ID will show in events.")
    ws.onmessage = (e) => log("Received: " + e.data)
    ws.onclose = () => log("Disconnected")

    function sendGuess() {
      const data = document.getElementById("msg").value
      ws.send(JSON.stringify({ MsgType: "Guess", Data: data }))
    }

    function startGame() {
      ws.send(JSON.stringify({ MsgType: "StartGame", Data: "" }))
    }

    function log(msg) {
      document.getElementById("log").innerHTML += "<p>" + msg + "</p>"
    }
  </script>
</body>
</html>
